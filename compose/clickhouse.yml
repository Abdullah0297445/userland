services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    networks:
      - clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_backups:/var/lib/clickhouse/backups
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-0}

networks:
  clickhouse: {}

volumes:
  clickhouse_data: {}
  clickhouse_backups: {}
