{{ define "fort" -}}
build:
  context: .
  dockerfile: Dockerfile
image: userland/fort:0.19.1
environment:
  <<: *userland-environment
  RESTIC_REPOSITORY: s3:${FORT_S3_ENDPOINT}/${FORT_S3_BUCKET}
  RESTIC_PASSWORD_COMMAND: /usr/local/bin/fort-key
  RESTIC_HOST: fort
  AWS_ACCESS_KEY_ID: ${FORT_S3_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${FORT_S3_SECRET_ACCESS_KEY}
  AWS_DEFAULT_REGION: ${FORT_S3_REGION}
  FORT_KEY_PROVIDER: ${FORT_KEY_PROVIDER}
  FORT_KEY_NAME: ${FORT_KEY_NAME}
  FORT_KEY_REGION: ${FORT_KEY_REGION}
  FORT_KEY_ACCESS_KEY_ID: ${FORT_KEY_ACCESS_KEY_ID}
  FORT_KEY_SECRET_ACCESS_KEY: ${FORT_KEY_SECRET_ACCESS_KEY}
  FORT_FILES: ${FORT_FILES:-}
  FORT_SCHEDULE: ${FORT_SCHEDULE:-@daily}
{{- if .Mounts }}
volumes:
{{- range .Mounts }}
  - {{ . }}
{{- end }}
{{- end }}
{{ end }}
