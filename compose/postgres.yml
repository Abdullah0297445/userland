{{ define "postgres-18" -}}
image: pgvector/pgvector:pg18-trixie
environment:
  <<: *userland-environment
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
volumes:
  - postgres_data:/var/lib/postgresql
  - ./initdb:/docker-entrypoint-initdb.d:ro
healthcheck:
  test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s
shm_size: 256m
{{ end }}

{{ define "pgbouncer-transaction" -}}
image: edoburu/pgbouncer:v1.25.2-p0
environment:
  <<: *userland-environment
  DATABASE_URL: postgres://pgbouncer_auth:${PGBOUNCER_AUTH_PASSWORD}@postgres-18:5432/
  AUTH_TYPE: scram-sha-256
  AUTH_USER: pgbouncer_auth
  AUTH_QUERY: SELECT * FROM public.pgbouncer_get_auth($$1)
  AUTH_DBNAME: postgres
  POOL_MODE: transaction
  LISTEN_PORT: 5432
  MAX_CLIENT_CONN: 500
healthcheck:
  test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
  interval: 10s
  timeout: 5s
  retries: 5
{{ end }}

