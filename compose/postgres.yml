x-door: &door
  image: edoburu/pgbouncer:v1.25.2-p0
  restart: unless-stopped
  depends_on:
    postgres-18:
      condition: service_healthy
  networks:
    - postgres
    - postgres-server
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
    interval: 10s
    timeout: 5s
    retries: 5

x-door-environment: &door-environment
  DATABASE_URL: postgres://pgbouncer_auth:${PGBOUNCER_AUTH_PASSWORD:?}@postgres-18:5432/
  AUTH_TYPE: scram-sha-256
  AUTH_USER: pgbouncer_auth
  AUTH_QUERY: SELECT * FROM public.pgbouncer_get_auth($$1)
  AUTH_DBNAME: postgres
  LISTEN_PORT: 5432
  MAX_CLIENT_CONN: 500

services:
  postgres-18:
    image: pgvector/pgvector:pg18-trixie
    container_name: postgres-18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PGBOUNCER_AUTH_USER: pgbouncer_auth
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?}
    networks:
      - postgres-server
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${POSTGRES_18_MEM_LIMIT:-0}

  pgbouncer-transaction:
    <<: *door
    container_name: pgbouncer-transaction
    environment:
      <<: *door-environment
      POOL_MODE: transaction
    mem_limit: ${PGBOUNCER_TRANSACTION_MEM_LIMIT:-0}

  pgbouncer-session:
    <<: *door
    container_name: pgbouncer-session
    environment:
      <<: *door-environment
      POOL_MODE: session
      DEFAULT_POOL_SIZE: 100
    mem_limit: ${PGBOUNCER_SESSION_MEM_LIMIT:-0}

  postgres-dumper:
    image: pgvector/pgvector:pg18-trixie
    container_name: postgres-dumper
    restart: unless-stopped
    init: true
    depends_on:
      postgres-18:
        condition: service_healthy
    entrypoint: ["dumper"]
    environment:
      PGHOST: postgres-18
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: postgres
      DUMPER_DATASTORE: postgres
      DUMPER_HOURS: ${POSTGRES_DUMPER_HOURS:-24}
    networks:
      - postgres-server
    volumes:
      - backups:/backups
      - ./scripts/dumper:/usr/local/bin/dumper:ro
    healthcheck:
      test: ["CMD", "dumper", "health"]
      interval: 10s
      timeout: 5s
      retries: 1
    mem_limit: ${POSTGRES_DUMPER_MEM_LIMIT:-0}

networks:
  postgres: {}
  postgres-server: {}

volumes:
  postgres_data: {}
  backups: {}
