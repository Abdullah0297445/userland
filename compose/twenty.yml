{{ define "twenty.environment" }}
  SERVER_URL: {{ if .On "traefik" }}{{ if eq .Visibility "public" }}https://twenty.${DOMAIN}{{ else }}http://twenty.localhost{{ end }}{{ else }}http://localhost:3002{{ end }}
  PG_DATABASE_URL: postgres://{{ .Postgres.Database }}:{{ ref .Postgres.Password }}@pgbouncer-session:5432/{{ .Postgres.Database }}
  REDIS_URL: redis://:${TWENTY_REDIS_PASSWORD}@twenty-redis:6379
  ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY}
  STORAGE_TYPE: s3
  STORAGE_S3_NAME: ${TWENTY_S3_BUCKET}
  STORAGE_S3_REGION: ${TWENTY_S3_REGION}
  STORAGE_S3_ENDPOINT: ${TWENTY_S3_ENDPOINT}
  STORAGE_S3_ACCESS_KEY_ID: ${TWENTY_S3_ACCESS_KEY_ID}
  STORAGE_S3_SECRET_ACCESS_KEY: ${TWENTY_S3_SECRET_ACCESS_KEY}
{{- end }}

{{ define "twenty-server" -}}
image: twentycrm/twenty:v2.41.0
environment:
  <<: *userland-environment
{{ template "twenty.environment" . }}
healthcheck:
  test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:3000/healthz"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 300s
{{ end }}

{{ define "twenty-worker" -}}
image: twentycrm/twenty:v2.41.0
command: ["yarn", "worker:prod"]
environment:
  <<: *userland-environment
{{ template "twenty.environment" . }}
  DISABLE_DB_MIGRATIONS: true
  DISABLE_CRON_JOBS_REGISTRATION: true
{{ end }}

{{ define "twenty-redis" -}}
image: redis:7-alpine
command: ["redis-server", "--requirepass", "${TWENTY_REDIS_PASSWORD}", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
environment:
  <<: *userland-environment
  REDISCLI_AUTH: ${TWENTY_REDIS_PASSWORD}
volumes:
  - twenty_redis_data:/data
healthcheck:
  test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
  interval: 10s
  timeout: 5s
  retries: 5
{{ end }}
